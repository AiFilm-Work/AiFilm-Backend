services:
  mysql:
    image: mysql:8.4
    container_name: aifilm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-aifilm}
      MYSQL_USER: ${DB_USERNAME:-aifilm}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - aifilm-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  aifilm-mysql-data:
    name: aifilm-mysql-data
