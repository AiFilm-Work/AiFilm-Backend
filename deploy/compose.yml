# 배포 서버(EC2)용 compose 파일. 서버의 /opt/aifilm/compose.yml로 옮겨 쓴다.
# DB는 RDS를 쓰므로 앱 컨테이너만 띄운다. 값은 같은 폴더의 .env에서 읽는다. (예시: deploy/.env.example)
services:
  app:
    # 필수 값이 비어 있으면 컨테이너를 띄우지 않고 바로 실패한다
    image: ${APP_IMAGE:?APP_IMAGE를 .env에 지정하세요}
    container_name: aifilm-app
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST를 .env에 지정하세요}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?DB_NAME을 .env에 지정하세요}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 .env에 지정하세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 지정하세요}
      AIFILM_API_ENABLED: ${AIFILM_API_ENABLED:-true}
      AIFILM_WORKER_ENABLED: ${AIFILM_WORKER_ENABLED:-true}
      # 서버 메모리가 2GB라 컨테이너 상한(1.5GB)의 65%를 힙으로 쓰고, 나머지는 메타스페이스·스레드 등에 남긴다
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0"
    mem_limit: 1536m
    ports:
      - "8080:8080"
    # 로그 파일이 디스크를 채우지 않게 10MB씩 3개까지만 남긴다
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
