# 배포 서버의 /etc/nginx/conf.d/aifilm.conf로 옮겨 쓴다. 서버에서 직접 고치지 않고 이 파일을 고친 뒤 옮긴다.
# 인증서는 certbot(Let's Encrypt)이 /etc/letsencrypt/live/api.aifilm.life/에 발급·갱신한다.

# HTTP는 HTTPS로 넘긴다. 인증서 갱신 때 certbot이 이 블록에 확인 경로를 잠시 추가하므로 return은 location 안에 둔다.
server {
    listen 80;
    listen [::]:80;
    server_name api.aifilm.life;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aifilm.life;

    ssl_certificate /etc/letsencrypt/live/api.aifilm.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aifilm.life/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 응답 헤더와 에러 페이지에 Nginx 버전을 노출하지 않는다
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Nginx가 가장 앞단이라 클라이언트가 보낸 X-Forwarded-For를 이어 붙이지 않고 실제 주소로 새로 쓴다
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
