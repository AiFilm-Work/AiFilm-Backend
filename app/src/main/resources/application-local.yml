# 로컬 실행용 설정. docker compose로 띄운 MySQL에 붙고, 환경변수가 없으면 .env.example과 같은 기본값을 쓴다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aifilm}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:aifilm}
    password: ${DB_PASSWORD}

logging:
  level:
    # 로컬에서만 실행되는 SQL을 로그로 본다
    org.hibernate.SQL: debug
