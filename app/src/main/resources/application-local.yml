# 로컬 실행용 설정. docker compose로 띄운 MySQL에 붙는다. 접속 정보는 환경변수가 없으면 .env.example과 같은 기본값을 쓰고, 비밀번호(DB_PASSWORD)만 환경변수로 받는다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aifilm}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:aifilm}
    password: ${DB_PASSWORD}

logging:
  level:
    # 로컬에서만 실행되는 SQL을 로그로 본다
    org.hibernate.SQL: debug

aifilm:
  cors:
    # 로컬 프론트 개발 서버(Next.js 기본 포트)에서 브라우저로 API를 부를 수 있게 한다
    allowed-origins: http://localhost:3000
