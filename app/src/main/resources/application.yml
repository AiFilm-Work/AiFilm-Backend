spring:
  application:
    name: aifilm
  profiles:
    # 프로파일을 지정하지 않고 실행하면 local로 뜬다. 배포 서버는 SPRING_PROFILES_ACTIVE=prod로 실행한다
    default: local
  # DB 접속 정보는 환경마다 달라서 application-local.yml, application-prod.yml에 둔다
  jpa:
    # 영속성 컨텍스트는 서비스 트랜잭션 안에서만 쓴다. 응답을 만드는 동안 DB 커넥션을 붙잡지 않는다
    open-in-view: false
    hibernate:
      # 스키마는 Flyway로만 바꾼다. 엔티티와 테이블이 다르면 시작 시 실패한다
      ddl-auto: validate

# 실행 모드 스위치. 둘 다 true면 API와 Worker가 하나의 JVM에서 함께 실행된다.
# 분리 실행할 때는 환경변수(AIFILM_API_ENABLED, AIFILM_WORKER_ENABLED)로 덮어쓴다.
aifilm:
  api:
    enabled: true
  worker:
    enabled: true
