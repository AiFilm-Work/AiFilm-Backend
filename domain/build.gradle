// domain: 핵심 비즈니스 로직 모듈. common에만 의존하며 특정 기술 구현에 독립적이다.
bootJar {
	enabled = false
}

jar {
	enabled = true
	archiveClassifier = ''
}

dependencies {
	api project(':common')

	// 엔티티 매핑 애너테이션(jakarta.persistence) 스펙만 쓴다. Hibernate·Spring Data 의존은 infra에 둔다.
	api 'jakarta.persistence:jakarta.persistence-api'

	// 도메인 규칙은 스프링 없이 단위 테스트한다
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.assertj:assertj-core'
}
