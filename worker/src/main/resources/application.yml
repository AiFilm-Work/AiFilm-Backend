spring:
  application:
    name: aifilm-worker
  datasource:
    # api와 동일한 물리 MySQL 스키마(aifilm)를 함께 사용.
    url: jdbc:mysql://localhost:3306/${DB_NAME:aifilm}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:aifilm}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
