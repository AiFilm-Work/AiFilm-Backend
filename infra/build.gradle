// infra: domain의 Repository/interface를 구현하는 외부 인프라 모듈 (JPA, MySQL, Flyway 등).
bootJar {
    enabled = false
}

jar {
    enabled = true
    archiveClassifier = ''
}

dependencies {
    api project(':common')
    api project(':domain')

    // JPA 스캔 설정(@EntityScan, @EnableJpaRepositories)은 infra의 JpaConfig가 담당한다.
    // api로 노출하는 범위는 Entity/Repository 위치가 정해지면 다시 검토한다.
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Spring Boot 4부터 Flyway 자동 설정은 스타터로 따로 추가해야 한다. MySQL 지원은 flyway-mysql이 담당한다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    // 리포지토리 테스트가 MySQL 컨테이너를 띄운다. 버전은 Spring Boot BOM이 관리한다 (Testcontainers 2.x).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'
}
