name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR(또는 브랜치)에 새 커밋이 올라오면 진행 중인 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # 러너 이미지가 바뀌면서 빌드·배포가 흔들리지 않도록 Ubuntu 버전을 고정한다. 올릴 때는 ci.yml과 cd.yml을 함께 바꾼다.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # 코드를 받은 뒤에는 git 인증이 필요 없으므로, PR 코드가 실행되는 빌드 단계에 토큰을 남기지 않는다.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 배포 서버에서 실행되는 스크립트라 빌드보다 먼저 문법과 흔한 실수를 검사한다.
      - name: Lint deploy script
        run: shellcheck deploy/deploy.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle wrapper 검증과 의존성 캐시를 함께 한다. 비공개 저장소라 MIT 라이선스인 basic 캐시를 쓴다.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # app 통합 테스트는 러너의 Docker에서 Testcontainers로 MySQL을 띄운다.
      - name: Build
        run: ./gradlew build

      # main에 반영된 빌드의 jar는 CD가 이미지로 만든다. PR 실행에서는 배포하지 않으므로 올리지 않는다.
      - name: Upload app jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: app/build/libs/aifilm-app.jar
          if-no-files-found: error
          retention-days: 3

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 7
