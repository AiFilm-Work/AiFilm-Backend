name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR(또는 브랜치)에 새 커밋이 올라오면 진행 중인 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 코드를 받은 뒤에는 git 인증이 필요 없으므로, PR 코드가 실행되는 빌드 단계에 토큰을 남기지 않는다.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle wrapper 검증과 의존성 캐시를 함께 한다. 비공개 저장소라 MIT 라이선스인 basic 캐시를 쓴다.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # app 통합 테스트는 러너의 Docker에서 Testcontainers로 MySQL을 띄운다.
      - name: Build
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 7
